spring:
  application:
    name: forgemind-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:forgemind}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:forgemind}
    password: ${DB_PASSWORD:forgemind}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 80MB
      max-request-size: 90MB
server:
  port: 8080

forgemind:
  auth:
    otp-pepper: ${FORGEMIND_AUTH_OTP_PEPPER:change-me-in-production}
  email:
    # Disabled by default so local startup never sends mail accidentally.
    enabled: ${FORGEMIND_EMAIL_ENABLED:false}
    host: ${FORGEMIND_EMAIL_HOST:}
    port: ${FORGEMIND_EMAIL_PORT:587}
    username: ${FORGEMIND_EMAIL_USERNAME:}
    password: ${FORGEMIND_EMAIL_PASSWORD:}
    from: ${FORGEMIND_EMAIL_FROM:}
    starttls: ${FORGEMIND_EMAIL_STARTTLS:true}
  oauth:
    github:
      enabled: ${FORGEMIND_GITHUB_ENABLED:false}
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${FORGEMIND_GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}
      frontend-url: ${FORGEMIND_GITHUB_FRONTEND_URL:http://localhost:5173/forgecloud}
  sms:
    # Disabled by default so local startup never sends paid messages accidentally.
    enabled: ${FORGEMIND_SMS_ENABLED:false}
    secret-id: ${TENCENTCLOUD_SECRET_ID:}
    secret-key: ${TENCENTCLOUD_SECRET_KEY:}
    region: ${TENCENTCLOUD_SMS_REGION:ap-guangzhou}
    sdk-app-id: ${TENCENTCLOUD_SMS_SDK_APP_ID:1401187760}
    sign-name: ${TENCENTCLOUD_SMS_SIGN_NAME:}
    template-id: ${TENCENTCLOUD_SMS_TEMPLATE_ID:}
